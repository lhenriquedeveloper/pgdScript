[project]
name = "pgd-report"
version = "0.1.0"
description = "Automação CLI para coleta e consolidação de entregas semanais do PGD via GLPI (AtendeMais) e GitLab UFT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
pgd-report = "pgd_report.cli:app"
pgd = "pgd_report.cli:app"

[tool.setuptools.packages.find]
include = ["pgd_report*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

